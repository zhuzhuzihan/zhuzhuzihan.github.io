<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 第六十天的恋爱纪念日 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #44cef6 0%, #ffc0cb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 猫咪装饰元素 */
        .cat-decoration {
            position: absolute;
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
        }

        .cat1 { top: 10%; left: 10%; animation-delay: 0s; }
        .cat2 { top: 20%; right: 15%; animation-delay: 1s; }
        .cat3 { bottom: 15%; left: 20%; animation-delay: 2s; }
        .cat4 { bottom: 25%; right: 10%; animation-delay: 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* 验证页面样式 */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: slideIn 0.5s ease-out;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem;
                width: 95%;
            }
            
            .login-title {
                font-size: 1.5rem;
            }
            
            .login-subtitle {
                font-size: 1rem;
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-title {
            font-size: 1.8rem;
            color: #764ba2;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .login-subtitle {
            color: #f093fb;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            color: #764ba2;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #f093fb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 10px rgba(118, 75, 162, 0.2);
        }

        .login-btn {
            background: linear-gradient(45deg, #44cef6, #ffc0cb);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .error-message {
            color: #e74c3c;
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
        }

        /* 主页面样式 */
        .main-container {
            display: none;
            text-align: center;
            max-width: 800px;
            width: 90%;
            animation: fadeIn 1s ease-out;
        }

        @media (max-width: 768px) {
            .main-container {
                width: 95%;
                padding: 0 1rem;
            }
            
            .main-title {
                font-size: 2rem;
            }
            
            .message-container {
                padding: 1.5rem;
                min-height: 120px;
            }
            
            .message-text {
                font-size: 1.1rem;
            }
        }

        @media (max-width: 480px) {
            .main-title {
                font-size: 1.5rem;
            }
            
            .message-container {
                padding: 1rem;
                min-height: 100px;
            }
            
            .message-text {
                font-size: 1rem;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .main-title {
            font-size: 3rem;
            color: white;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .message-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .message-text {
            font-size: 1.3rem;
            color: #764ba2;
            line-height: 1.8;
            font-weight: 500;
        }

        .images-container {
            display: none;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .image-item {
            position: relative;
            transition: all 0.5s ease;
        }

        .image-item img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            .image-item img {
                width: 150px;
                height: 150px;
            }
        }

        @media (max-width: 480px) {
            .images-container {
                gap: 0.5rem;
            }
            
            .image-item img {
                width: 120px;
                height: 120px;
            }
        }

        .image-item img:hover {
            transform: scale(1.05);
        }

        .image-item.slide-in-left {
            animation: slideInLeft 0.8s ease-out forwards;
        }

        .image-item.slide-in-center {
            animation: slideInCenter 0.8s ease-out forwards;
        }

        .image-item.slide-in-right {
            animation: slideInRight 0.8s ease-out forwards;
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInCenter {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .delete-effect {
            animation: deleteEffect 0.5s ease-out forwards;
        }

        @keyframes deleteEffect {
            0% { 
                opacity: 1; 
                transform: scale(1);
            }
            50% { 
                background: #ffeb3b;
                transform: scale(1.05);
            }
            100% { 
                opacity: 0; 
                transform: scale(0.8);
            }
        }

        .heart {
            display: inline-block;
            color: #e91e63;
            animation: heartbeat 1s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <!-- 猫咪装饰 -->
    <div class="cat-decoration cat1">🐱</div>
    <div class="cat-decoration cat2">😺</div>
    <div class="cat-decoration cat3">😸</div>
    <div class="cat-decoration cat4">😻</div>

    <!-- 验证页面 -->
    <div class="login-container" id="loginPage">
        <h1 class="login-title">💕 爱的验证 💕</h1>
        <p class="login-subtitle">请输入你们的生日日期来进入纪念日页面</p>
        
        <div class="input-group">
            <label for="yourBirthday">子涵的生日</label>
            <input type="text" id="yourBirthday" placeholder="请输入子涵的生日" maxlength="4">
        </div>
        
        <div class="input-group">
            <label for="herBirthday">萱萱的生日</label>
            <input type="text" id="herBirthday" placeholder="请输入萱萱的生日" maxlength="4">
        </div>
        
        <button class="login-btn" onclick="checkBirthdays()">进入纪念日 💕</button>
        <div class="error-message" id="errorMessage">生日日期不正确，请重新输入哦 💕</div>
    </div>

    <!-- 主页面 -->
    <div class="main-container" id="mainPage">
        <div class="message-container">
            <div class="message-text" id="messageText"></div>
        </div>
        
        <div class="images-container" id="imagesContainer">
            <div class="image-item" id="image1">
                <img src="pic/1.jpg" alt="宝宝的照片1">
            </div>
            <div class="image-item" id="image2">
                <img src="pic/2.jpg" alt="宝宝的照片2">
            </div>
            <div class="image-item" id="image3">
                <img src="pic/3.jpg" alt="宝宝的照片3">
            </div>
        </div>
    </div>

    <script>
        const CORRECT_YOUR_BIRTHDAY = "0714";
        const CORRECT_HER_BIRTHDAY = "0905";

        function checkBirthdays() {
            const yourBirthday = document.getElementById('yourBirthday').value;
            const herBirthday = document.getElementById('herBirthday').value;
            const errorMessage = document.getElementById('errorMessage');

            if (yourBirthday === CORRECT_YOUR_BIRTHDAY && herBirthday === CORRECT_HER_BIRTHDAY) {
                errorMessage.classList.remove('show');
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainPage').style.display = 'block';
                startAnniversary();
            } else {
                errorMessage.classList.add('show');
                setTimeout(() => {
                    errorMessage.classList.remove('show');
                }, 3000);
            }
        }

        async function startAnniversary() {
            await sleep(1000);
            
            await typeMessage("今天是我们六十天纪念日呢[停顿2s，删除]");
            await deleteMessage();
            await typeMessage("我很开心陪你走到这一天，[停顿3s，删除]");
            await deleteMessage();
            await typeMessage("也不知道宝宝开不开心呀？[停顿3s]");
            await deleteMessage();
            
            await typeMessage("本来想准备礼物的，但是呢[停顿2s，使用删除效果]");
            await deleteMessage();
            await typeMessage("我不知道宝宝的住址呀[停顿2s，使用删除效果]");
            await deleteMessage();
            await typeMessage("我只知道宝宝的学校[停顿2s，使用删除效果]");
            await deleteMessage();
            await typeMessage("不知道宝宝的家离这远不远。[停顿3s]");
            await deleteMessage();
            
            await typeMessage("那就以后准备叭，[停顿3s]毕竟我还得好好了解宝宝呢💕[停顿3s]");
            await deleteMessage();
            
            await typeMessage("我现在只有宝宝的三张照片，都好好看[停顿2s,删除]");
            await deleteMessage();
            await typeMessage("宝宝能不能答应我给我更多好看的照片，好不好呀？😊");
            await sleep(3000);
            await deleteMessage();
            
            await typeMessage("现在呢，我是非宝宝不可了，也就是说，我的世界有你才完整😊");
            await sleep(3000);
            await typeMessage("我挺希望宝宝能多花点时间来陪陪我🥺[停顿3s，使用效果删除]");
            await deleteMessage();
            await typeMessage("不理我我真挺难受的😭[停顿3s，使用效果删除]");
            await deleteMessage();
            await typeMessage("还有就是我有点不希望看到宝宝跟别的男孩子双排，吃醋😕[停顿3s，使用删除效果]");
            await deleteMessage();
            await typeMessage("虽说我也不说什么，但是我宝宝在和他玩不理我真的好难受😭");
            await sleep(3000);
            await typeMessage("还有呢，为啥宝宝游戏不用情头了呀🤔，我想和宝宝用🥰，记得回答下哦，嘻嘻");
            await sleep(3000);
            await typeMessage("好啦，老婆");
            await sleep(2000);
            await deleteMessage();
            await typeMessage("宝宝，我们一起携手并进，让我们的故事更加丰满叭");
            await sleep(3000);
            await typeMessage("现在天气也是冷冷哒，记得添添衣服，注意保暖呀");
            await sleep(3000);
            await typeMessage("那我把我想说的说出来叭[停顿2s，删除]");
            await deleteMessage();
            await slowTypeMessage("我爱你!宝宝!💕💕");
        }

        async function typeMessage(message) {
            const messageElement = document.getElementById('messageText');
            messageElement.innerHTML = '';
            
            // 处理停顿标记
            const parts = message.split(/\[([^\]]+)\]/);
            
            for (let part of parts) {
                if (part.startsWith('停顿')) {
                    const seconds = parseInt(part.match(/\d+/)[0]);
                    await sleep(seconds * 1000);
                } else if (part === '删除' || part === 'Ctrl A + Backspace' || part === 'Ctrl A 然后Backspace的效果' || part === '使用效果删除' || part === '使用删除效果') {
                    await deleteMessage();
                } else {
                    // 正常文字逐字显示
                    for (let i = 0; i < part.length; i++) {
                        messageElement.innerHTML += part[i];
                        await sleep(200);
                    }
                }
            }
        }

        async function slowTypeMessage(message) {
            const messageElement = document.getElementById('messageText');
            messageElement.innerHTML = '';
            
            for (let i = 0; i < message.length; i++) {
                messageElement.innerHTML += message[i];
                await sleep(200);
            }
        }

        async function deleteMessage() {
            const messageElement = document.getElementById('messageText');
            messageElement.classList.add('delete-effect');
            await sleep(500);
            messageElement.innerHTML = '';
            messageElement.classList.remove('delete-effect');
        }

        

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 回车键提交
        document.getElementById('yourBirthday').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('herBirthday').focus();
            }
        });

        document.getElementById('herBirthday').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkBirthdays();
            }
        });
    </script>
</body>
</html>
